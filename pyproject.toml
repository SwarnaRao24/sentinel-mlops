[project]
name = "sentinel-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swarna Rao", email = "chintal1@uwindsor.ca" }
]
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.13.16",
    "dagster-webserver>=1.13.16",
    "evidently>=0.7.21",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.0",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pydantic>=2.13.4",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
sentinel-mlops = "sentinel_mlops:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]


[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.dagster]
module_name = "sentinel.pipelines.assets"

[tool.ruff.lint]
# Rules intentionally disabled:
#   BLE001 - blind except is deliberate in _git_sha (git failure must not break logging)
#   RUF059 - unpacked-but-unused is fine in tests where we assert on one element
ignore = ["BLE001", "RUF059"]
